---
name: CI
on:
  push:
    branches:
      - main
    tags:
      - '@upfluence/ember-brand-bundler@*'
      - '@upfluence/ember-brand-manager@*'
  pull_request:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_VERSION: 22

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Release Package
    runs-on: ubuntu-20.04
    if: startsWith(github.ref, 'refs/tags/@upfluence/ember-brand-')
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      - uses: actions/setup-node@v3
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Configure Registry
        run: echo "//npm.pkg.github.com/:_authToken=$GITHUB_TOKEN" >> ~/.npmrc
      - name: Publish ember-brand-bundler
        if: startsWith(github.ref_name, '@upfluence/ember-brand-bundler@')
        run: |
          VERSION=$(node -p "require('./packages/ember-brand-bundler/package.json').version")
          if [ "$GITHUB_REF_NAME" != "@upfluence/ember-brand-bundler@$VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match ember-brand-bundler version $VERSION." >&2
            exit 1
          fi

          DIST_TAG=${VERSION#*-}
          [ "$DIST_TAG" = "$VERSION" ] && DIST_TAG=latest || DIST_TAG=${DIST_TAG%%.*}
          pnpm --dir packages/ember-brand-bundler publish \
            --access public \
            --no-git-checks \
            --tag "$DIST_TAG"
      - name: Publish ember-brand-manager
        if: startsWith(github.ref_name, '@upfluence/ember-brand-manager@')
        run: |
          VERSION=$(node -p "require('./packages/ember-brand-manager/package.json').version")
          if [ "$GITHUB_REF_NAME" != "@upfluence/ember-brand-manager@$VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match ember-brand-manager version $VERSION." >&2
            exit 1
          fi

          DIST_TAG=${VERSION#*-}
          [ "$DIST_TAG" = "$VERSION" ] && DIST_TAG=latest || DIST_TAG=${DIST_TAG%%.*}
          pnpm --dir packages/ember-brand-manager publish \
            --access public \
            --no-git-checks \
            --tag "$DIST_TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
